name: Deploy API Dev

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy-api-dev:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Déployer l'API DEV
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/cesizen-dev/api
            git fetch origin
            git reset --hard origin/dev

            cd ~/cesizen-dev

            docker compose -f docker-compose.dev.yml stop api || true
            docker compose -f docker-compose.dev.yml rm -f api || true
            docker compose -f docker-compose.dev.yml build --no-cache api
            docker compose -f docker-compose.dev.yml up -d --no-deps api

            docker tag cesizen-dev-api:latest cesizen-api:latest || true

            docker compose -f docker-compose.dev.yml exec -T api npx prisma migrate deploy
          EOF