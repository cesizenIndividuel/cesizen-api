name: Deploy Dev Global

on:
  push:
    branches:
      - dev

jobs:
  deploy-dev-global:
    runs-on: ubuntu-latest

    steps:
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Déployer l'API DEV
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            cd ~/cesizen-dev/api
            git fetch origin
            git reset --hard origin/dev

            docker build -t cesizen-api:latest .

            docker compose -f docker-compose.dev.yml up -d

            docker compose -f docker-compose.dev.yml exec -T api npx prisma migrate deploy
            docker compose -f docker-compose.dev.yml exec -T api npx prisma db seed || true

            docker ps
          EOF

      - name: Déployer le Front DEV
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            cd ~/cesizen-dev/front
            git fetch origin
            git reset --hard origin/dev

            docker build -t cesizen-front:latest .

            docker rm -f cesizen-front-dev || true
            docker compose -f docker-compose.dev.yml up -d

            docker ps
            docker images | grep cesizen
          EOF