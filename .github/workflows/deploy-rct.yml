name: Deploy API Recette

on:
  push:
    branches:
      - rct

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer dépendances
        run: npm install

      - name: Builder l'API
        run: npm run build

      - name: Lancer les tests
        run: npm run test

      - name: Audit sécurité des dépendances
        run: npm audit --audit-level=high

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Déployer sur la VM
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/cesizen-api
            git fetch origin
            git reset --hard origin/rct
            docker compose -f docker-compose.rct.yml up -d --build
            docker compose -f docker-compose.rct.yml exec -T api npx prisma migrate deploy
          EOF