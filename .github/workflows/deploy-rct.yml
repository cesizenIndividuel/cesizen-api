name: Deploy API Recette

on:
  push:
    branches:
      - rct

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer dépendances
        run: npm ci

      - name: Générer Prisma Client
        run: npx prisma generate

      - name: Builder l'API
        run: npm run build

      - name: Lancer les tests
        run: npm run test

      - name: Audit sécurité des dépendances
        run: npm audit --audit-level=high

      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Déployer sur la VM
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/cesizen-api
            git fetch origin
            git reset --hard origin/rct
            docker compose -f docker-compose.rct.yml up -d --build
            docker compose -f docker-compose.rct.yml exec -T api npx prisma migrate deploy
          EOF