name: Deploy API Recette

on:
  push:
    branches:
      - rct

jobs:
  deploy-rct:
    runs-on: ubuntu-latest

    steps:
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Déployer l'API recette sur la VM
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/cesizen-api

            git fetch origin
            git reset --hard origin/rct

            docker compose -f docker-compose.rct.yml down

            docker rm -f cesizen-api-rct cesizen-postgres-rct || true

            docker compose -f docker-compose.rct.yml up -d

            docker compose -f docker-compose.rct.yml exec -T api npx prisma migrate deploy

            docker ps
          EOF