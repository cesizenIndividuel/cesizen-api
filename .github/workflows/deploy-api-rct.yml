name: Deploy API RCT

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy-api-rct:
    runs-on: ubuntu-latest

    steps:
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Déployer l'API RCT
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/cesizen-rct

            docker compose -f docker-compose.rct.yml stop api || true
            docker compose -f docker-compose.rct.yml rm -f api || true
            docker compose -f docker-compose.rct.yml up -d --no-deps api
            docker compose -f docker-compose.rct.yml exec -T api npx prisma migrate deploy
          EOF