services:
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cesizen-api-dev

    ports:
      - "3001:3000"

    env_file:
      - .env.dev

    networks:
      - cesizen-api_default

    restart: unless-stopped

networks:
  cesizen-api_default:
    external: true