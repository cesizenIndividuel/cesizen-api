services:
  api:
    build: .
    container_name: cesizen-api-rct
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://cesizen:cesizen@db:5432/cesizen_db
      NODE_ENV: recette
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: cesizen-postgres-rct
    environment:
      POSTGRES_USER: cesizen
      POSTGRES_PASSWORD: cesizen
      POSTGRES_DB: cesizen_db
    volumes:
      - cesizen_pgdata_rct:/var/lib/postgresql/data

volumes:
  cesizen_pgdata_rct: